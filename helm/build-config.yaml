apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: jee-msa-web-demo-pipeline
spec:
  lookupPolicy:
    local: true
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: jee-msa-web-demo-pipeline
spec:
  source:
    type: Git
    git:
      uri: https://github.com/cristiachele/jee-msa-web-demo-pipeline.git
    sourceSecret:
      name: tokendev
  strategy:
    type: Docker
  output:
    to:
      kind: ImageStreamTag
      name: jee-msa-web-demo-pipeline:latest
